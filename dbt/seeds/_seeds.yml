version: 2
seeds:
  - name: fixed_conversion_rates
    description: >
      Irrevocably fixed conversion rates for legacy currencies replaced by the euro.
      Used for any legacy-currency amount dated on/after the adoption date, when the ECB
      no longer publishes a market rate.
    config:
      column_types: {currency_code: varchar, units_per_eur: "decimal(18,6)", effective_from: date, legal_basis: varchar}
    columns:
      - name: currency_code
        data_tests: [unique, not_null]
