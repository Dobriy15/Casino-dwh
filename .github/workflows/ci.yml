name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint Python
        run: ruff check generator scripts

      - name: Generate synthetic source data
        run: python generator/generate.py --out data/raw --scale 0.3

      - name: dbt build (full refresh) - models + 100+ data tests
        working-directory: dbt
        run: |
          mkdir -p ../warehouse
          dbt build --profiles-dir . --full-refresh

      - name: dbt build (incremental re-run must be idempotent)
        working-directory: dbt
        run: dbt build --profiles-dir .

      - name: Answer the business questions
        run: |
          cd dbt && dbt compile --profiles-dir . --select "resource_type:analysis" > /dev/null && cd ..
          python scripts/answer_questions.py --limit 5

      - name: Generate dbt docs
        working-directory: dbt
        run: dbt docs generate --profiles-dir .

      - name: Upload dbt docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            dbt/target/index.html
            dbt/target/catalog.json
            dbt/target/manifest.json
